<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starfield Scroll Animation </title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="intro">
      <h1>Buckle Up</h1>
    </section>

    <section class="starfield">
      <canvas id="canvas"></canvas>

      <div class="starfield-headers">
        <h1 id="header-1">The whole galaxy opens up</h1>
        <h1 id="header-2">Leaving the known world behind</h1>
        <h1 id="header-3">And then everything goes still</h1>
      </div>
    </section>

    <section class="outro">
      <h1>We're Home</h1>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.11/dist/lenis.min.js"></script>
    <script type="module" src="script.js"></script>
  </body>
</html>
